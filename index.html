<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Desktop browser favicon (512×512) + iOS home-screen / web-app icon (180×180). -->
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/BKT-dark-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/BKT-apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The app supports both schemes (light + the [data-theme="dark"] palette).
         color-scheme advertises that to the UA; the resolved scheme + theme-color
         are written before first paint by the inline script below to avoid a
         flash of the wrong theme, then kept in sync by ThemeProvider. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <!-- FOUC guard: resolve light/dark/system from localStorage BEFORE the bundle
         loads and paint the right scheme immediately. Mirrors src/lib/theme.ts
         (keep STORAGE_KEY 'bkt-theme' + colors in lockstep). Inlined on purpose —
         it must run ahead of React. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('bkt-theme');
          var mode = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.setAttribute('data-theme', 'dark');
          else root.removeAttribute('data-theme');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0c0c0e' : '#ffffff');
        } catch (e) {
          /* no-op: fall back to the light default already in the markup */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <title>BKT AI-Apply</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
